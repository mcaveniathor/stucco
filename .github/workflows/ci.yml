name: CI
# Pushes to main and every pull request; other branches are checked once a
# pull request is open (or on demand), so a push isn't tested twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer push to the same pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Verifies in a fresh target dir: cargo reuses cached builds of
      # unchanged versions, so a cached target would verify against the
      # previous commit's copy of a workspace crate.
      - run: cargo publish --dry-run --workspace --exclude gallery --exclude hello --exclude orders --exclude orders-fullstack --exclude stucco-leptos --exclude site --exclude site-wasm --all-features --target-dir "$RUNNER_TEMP/publish"
  leptos-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      # This archive is unpacked outside the workspace. Only the preview uses
      # a path dependency; its styles resolve from published crates.io crates.
      # A fresh consumer target prevents workspace builds from masking omissions.
      - run: python3 tools/check-leptos-package.py --work-dir "$RUNNER_TEMP/leptos-package" --jobs 2
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          exclude: gallery,hello,orders,orders-fullstack,stucco-leptos,site,site-wasm
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --exclude stucco-redb --exclude orders --exclude stucco-leptos --exclude orders-fullstack --locked
      - run: cargo check -p stucco-tower --features multipart --locked
  leptos-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p stucco-leptos --features ssr --locked
      - run: cargo check -p stucco-leptos --lib --target wasm32-unknown-unknown --features hydrate --locked
  storage-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check -p stucco-redb -p orders --locked
      - run: cargo check -p orders-fullstack --features sqlite --locked
      - run: cargo check -p orders-fullstack --lib --target wasm32-unknown-unknown --features hydrate --locked
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The site's theme engine, built for the site tests.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
      # Browsers are cached per Playwright version; system libraries are not
      # cacheable, so a cache hit still installs those.
      - id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - run: npx playwright test
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: browser/test-results/
          retention-days: 7
      - name: Runtime size budget (6 KB gzip)
        run: test "$(gzip -c ../target/gallery/_stucco/stucco-runtime.*.js | wc -c)" -le 6144
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --release
  fullstack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: cargo install cargo-leptos --version 0.3.11 --locked
      - run: cargo test -p stucco-leptos -p orders-fullstack --features ssr --locked
      - run: cargo test -p orders-fullstack --features sqlite --locked
      - run: cargo clippy -p stucco-leptos -p orders-fullstack --all-targets --features ssr,sqlite --locked -- -D warnings
      - run: cargo clippy -p stucco-leptos -p orders-fullstack --lib --target wasm32-unknown-unknown --features hydrate --locked -- -D warnings
      # Keep this build last: cargo-leptos supplies compile-time hydration names.
      - run: cargo leptos build -p orders-fullstack --release --cargo-locked
      - name: Test runtime packaging safeguards
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test-package-orders.py
      - name: Package the release runtime
        # Keep the no-clobber destination outside rust-cache's target tree.
        run: python3 tools/package-orders.py --output "$RUNNER_TEMP/orders-release"
      - name: Rehearse the copied release runtime
        run: python3 tools/smoke-orders-bundle.py "$RUNNER_TEMP/orders-release"
      - run: npm ci
        working-directory: browser
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: browser
      - run: npx playwright test --config playwright.fullstack.config.ts
        working-directory: browser
        env:
          STUCCO_E2E_BUNDLE: ${{ runner.temp }}/orders-release
      # Upload a tarball so the server retains its executable permissions.
      - name: Archive the verified release runtime
        run: tar -czf "$RUNNER_TEMP/orders-release.tar.gz" -C "$RUNNER_TEMP" orders-release
      - uses: actions/upload-artifact@v4
        with:
          name: orders-fullstack-release-bundle
          path: ${{ runner.temp }}/orders-release.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fullstack-browser-results
          path: browser/test-results/
          retention-days: 7
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check -p stucco --each-feature --no-dev-deps
      - run: cargo hack test -p stucco-ui --each-feature
      - run: cargo hack check -p stucco-tower -p stucco-redb --each-feature --no-dev-deps
      - run: cargo test -p stucco-tower --features csrf,multipart --locked
      - run: cargo test -p stucco-redb --no-default-features
