name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the theme engine
        run: cargo build -p site-wasm --target wasm32-unknown-unknown --profile wasm
      - name: Build the site
        run: >-
          cargo run -p site --release --
          _site
          --base "/${{ github.event.repository.name }}/"
          --wasm target/wasm32-unknown-unknown/wasm/site_wasm.wasm
      - name: Build the API reference
        run: >-
          cargo doc --workspace --no-deps --all-features
          --exclude gallery --exclude hello --exclude orders --exclude site --exclude site-wasm
      - run: cp -r target/doc _site/api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
