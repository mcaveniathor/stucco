name: Release
# Publishes to crates.io with trusted publishing: each job exchanges the
# workflow's GitHub OIDC identity for a short-lived crates.io token, so no
# registry token is stored in the repository (see RELEASING.md).
#
# A version tag such as v0.2.0 publishes the stable crates, then creates the
# GitHub release from the changelog. A stucco-leptos-v* tag publishes only
# the independently versioned preview. crates.io names this file and the
# crates-io environment in each crate's trusted publisher.
on:
  push:
    tags: ["v*", "stucco-leptos-v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the version and is on main
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stucco") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the workspace version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME isn't on main"
            exit 1
          fi
      - name: Check the changelog has this version
        run: grep -q "^## ${GITHUB_REF_NAME#v} " CHANGELOG.md
      - run: cargo test --workspace --locked
      # The token lasts 30 minutes, so it is requested only once the checks pass.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        run: cargo publish --workspace --locked --exclude gallery --exclude hello --exclude orders --exclude orders-fullstack --exclude stucco-leptos --exclude site --exclude site-wasm
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create the GitHub release
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v} " \
            'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > notes.md
          # A release made by hand (which also creates the tag) is left as it is.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists; leaving it."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
  publish-leptos-preview:
    if: startsWith(github.ref_name, 'stucco-leptos-v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches the preview version and is on main
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stucco-leptos") | .version')
          if [ "stucco-leptos-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the stucco-leptos version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME isn't on main"
            exit 1
          fi
      - run: cargo test -p stucco-leptos --locked --no-default-features --features ssr
      - run: cargo doc -p stucco-leptos --locked --no-default-features --features ssr --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 tools/check-leptos-package.py --work-dir "$RUNNER_TEMP/leptos-package" --jobs 2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish stucco-leptos to crates.io
        run: cargo publish -p stucco-leptos --locked --no-default-features --features ssr
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
