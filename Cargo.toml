[workspace]
members = ["crates/*", "examples/*", "gallery", "site", "site/wasm"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcaveniathor/stucco"
homepage = "https://github.com/mcaveniathor/stucco"
include = ["Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "LICENSE-LUCIDE", "src/**", "tests/**", "css/**", "js/**"]

[workspace.dependencies]
stucco-theme = { path = "crates/stucco-theme", version = "0.2.1" }
stucco-core = { path = "crates/stucco-core", version = "0.2.1" }
stucco-ui = { path = "crates/stucco-ui", version = "0.2.1" }
stucco = { path = "crates/stucco", version = "0.2.1" }
inventory = "0.3"
tower = "0.5.3"
http = "1.5"
http-body = "1.1"
http-body-util = "0.1.5"
bytes = "1.12"
pin-project = "1.1.13"
axum = { version = "0.8.9", default-features = false }
tower-http = "0.7.1"
tokio = "1.53"
tracing = "0.1"
tracing-subscriber = "0.3.23"
stucco-tower = { path = "crates/stucco-tower", version = "0.2.1" }
stucco-macros = { path = "crates/stucco-macros", version = "0.2.1" }
insta = "1"
form_urlencoded = "1"

# The documentation site's WebAssembly theme engine: small and self-contained.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
