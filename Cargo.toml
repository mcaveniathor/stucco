[workspace]
members = ["crates/*", "examples/*", "gallery"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
stucco-theme = { path = "crates/stucco-theme", version = "0.1.0" }
stucco-core = { path = "crates/stucco-core", version = "0.1.0" }
stucco-ui = { path = "crates/stucco-ui", version = "0.1.0" }
stucco = { path = "crates/stucco", version = "0.1.0" }
inventory = "0.3"
tower = "0.5.3"
http = "1.5"
http-body = "1.1"
http-body-util = "0.1.5"
bytes = "1.12"
pin-project = "1.1.13"
axum = { version = "0.8.9", default-features = false }
tower-http = "0.7.1"
tokio = "1.53"
tracing = "0.1"
tracing-subscriber = "0.3.23"
stucco-tower = { path = "crates/stucco-tower", version = "0.1.0" }
insta = "1"
form_urlencoded = "1"
