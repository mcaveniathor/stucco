[workspace]
members = ["crates/*", "gallery"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
stucco-theme = { path = "crates/stucco-theme", version = "0.1.0" }
stucco-core = { path = "crates/stucco-core", version = "0.1.0" }
stucco-ui = { path = "crates/stucco-ui", version = "0.1.0" }
stucco = { path = "crates/stucco", version = "0.1.0" }
inventory = "0.3"
insta = "1"
