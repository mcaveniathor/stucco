[package]
name = "stucco-macros"
description = "Derive macros for stucco: table columns from a struct's fields."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include.workspace = true
readme = "README.md"
documentation = "https://docs.rs/stucco"
keywords = ["ui", "html", "server-rendered", "derive"]
categories = ["web-programming"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["clone-impls", "derive", "parsing", "printing", "proc-macro"] }
