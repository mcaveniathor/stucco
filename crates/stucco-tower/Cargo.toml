[package]
name = "stucco-tower"
description = "Tower integration for stucco: asset serving, page/fragment responses, negotiation and standard layers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
stucco-core.workspace = true
tower.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
pin-project.workspace = true
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["trace", "request-id", "limit", "timeout", "set-header"] }
tracing = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }

[features]
default = ["axum", "tower-http"]
axum = ["dep:axum"]
tower-http = ["dep:tower-http", "dep:tokio", "dep:tracing", "tower/util"]

[dev-dependencies]
stucco-theme.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
