[package]
name = "stucco-tower"
description = "Tower integration for stucco: asset serving, page/fragment responses, negotiation and standard layers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include.workspace = true
readme = "README.md"
documentation = "https://docs.rs/stucco-tower"
keywords = ["ui", "html", "server-rendered"]
categories = ["web-programming"]

[dependencies]
stucco-core.workspace = true
stucco-theme.workspace = true
tower.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
pin-project.workspace = true
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["trace", "request-id", "limit", "timeout", "set-header"] }
tracing = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }
form_urlencoded = { workspace = true, optional = true }
multer = { version = "=3.1.0", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

[features]
default = ["axum", "tower-http", "csrf"]
csrf = ["dep:hmac", "dep:sha2", "dep:getrandom", "dep:base64", "dep:form_urlencoded", "dep:tracing"]
multipart = ["csrf", "dep:multer", "dep:futures-util"]
axum = ["dep:axum"]
tower-http = ["dep:tower-http", "dep:tokio", "dep:tracing", "tower/util"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }

[package.metadata.docs.rs]
all-features = true
