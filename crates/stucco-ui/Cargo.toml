[package]
name = "stucco-ui"
description = "Semantic UI components for stucco: layouts, forms, tables, collections, application shells and icons."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include.workspace = true
readme = "README.md"
documentation = "https://docs.rs/stucco-ui"
keywords = ["ui", "html", "server-rendered"]
categories = ["web-programming"]

[dependencies]
stucco-core.workspace = true
form_urlencoded.workspace = true

[features]
layout = []
typography = []
actions = []
forms = ["actions"]
icons = []
data = ["layout", "typography"]
feedback = ["typography"]
navigation = []
overlay = ["actions", "typography"]
app = ["layout", "navigation", "typography"]
collections = ["data", "forms", "navigation", "feedback"]

[dev-dependencies]
stucco-theme.workspace = true

[package.metadata.docs.rs]
all-features = true
