[package]
name = "stucco"
description = "Server-rendered, themeable, accessible UI components for Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
stucco-core.workspace = true
stucco-theme.workspace = true
stucco-ui.workspace = true

[features]
default = ["layout", "typography", "actions", "forms", "feedback", "navigation", "overlay", "data", "app"]
layout = ["stucco-ui/layout"]
typography = ["stucco-ui/typography"]
actions = ["stucco-ui/actions"]
forms = ["actions", "stucco-ui/forms"]
feedback = ["stucco-ui/feedback"]
navigation = ["stucco-ui/navigation"]
overlay = ["actions"]
data = ["stucco-ui/data"]
collections = ["data", "forms", "navigation", "feedback", "stucco-ui/collections"]
app = ["navigation", "layout", "stucco-ui/app"]
marketing = ["layout", "typography", "actions"]
diagram = ["icons"]
icons = ["stucco-ui/icons"]
markdown = ["typography"]
askama = []
maud = []
